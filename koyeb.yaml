services:
  - name: sevenleads
    dockerfile: Dockerfile
    ports:
      - port: 3000
        protocol: http
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3000"
    routes:
      - path: /
        service: sevenleads
    healthcheck:
      path: /api/health
      port: 3000
      interval: 30
      timeout: 10
    resources:
      memory: 512
      cpu: 0.5
    scaling:
      min: 1
      max: 1
    volumes:
      - name: data
        path: /app/data
